<script>
(function () {
  const LW = 1664, LH = 776, X0 = 110, Y0 = 680, W = 1500, H = 610, HP = 0.9 * H;
  const GREY = '#5f6670', BLUE = '#2b4c7e', RED = '#c0392b', FS = 38;
  const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x, lerp = (a, b, u) => a + (b - a) * u;
  const io = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const back = u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
  const pr = (e, s, d) => clamp((e - s) / d);
  const rng = a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  function makeAnim(cv) {
    const d = cv.dataset;
    const N = +(d.n || 25), T = +(d.t || 20), STEPS = +(d.steps || 400), ALPHA = +(d.alpha || 0.05), SEED = +(d.seed || 3);
    const R = rng(SEED);
    const gauss = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); };
    const dt = T / STEPS, sd = Math.sqrt(dt), P = [], S = [], A = [];
    let vmin = 0, vmax = 0;
    for (let i = 0; i < N; i++) {
      const p = [0]; let m = 0, am = 0;
      for (let k = 1; k <= STEPS; k++) {
        const x = p[k - 1] + sd * gauss(); p.push(x);
        if (x > m) { m = x; am = k * dt; }
        vmin = Math.min(vmin, x); vmax = Math.max(vmax, x);
      }
      P.push(p); S.push(m); A.push(am);
    }
    { const pad = 0.06 * (vmax - vmin); vmin -= pad; vmax += pad; }
    const SS = [...S].sort((a, b) => a - b), span = SS[N - 1] - SS[0] || 1;
    const lo = SS[0] - 0.12 * span, hi = SS[N - 1] + 0.12 * span;
    const Q = SS[Math.ceil((1 - ALPHA) * N - 1e-9) - 1];
    const xs = v => X0 + (v - lo) / (hi - lo) * W;
    // 'true' process with positive drift, stopped when it first reaches Q (data-drift overrides the default)
    const MU = +(d.drift || 1.4 * Q / T);
    let AP = null, HK = 0;
    for (let s = 0; s < 500 && !AP; s++) {
      const r2 = rng(SEED * 7919 + 17 + s);
      const g2 = () => { let u = 0; while (!u) u = r2(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r2()); };
      const p = [0];
      for (let k = 1; k <= STEPS; k++) {
        const x = p[k - 1] + MU * dt + sd * g2(); p.push(x);
        if (x >= Q) { if (k >= 0.3 * STEPS && k <= 0.8 * STEPS && Math.min(...p) > vmin) { p[k] = Q; AP = p; HK = k; } break; }
      }
    }
    // path schedule: first three slow, then ~20% faster each, floor 0.12 s
    const DUR = [], ST = [];
    { let t = 0.3; for (let i = 0; i < N; i++) { const dd = 0.12 + 0.63 * Math.pow(0.8, Math.max(0, i - 2)); DUR.push(dd); ST.push(t); t += dd; } }
    const END = [0, ST[N - 1] + DUR[N - 1] + 0.1, 0.85 + N * 0.1, 4.4, 1.2, 3.4, 3.4];

    const ctx = cv.getContext('2d');
    let K = 1, U = 0, stage = 0, e = Infinity, t0 = null, raf = 0;
    const Rv = (px, py) => { const th = U * Math.PI / 2, c = Math.cos(th), s = Math.sin(th); return [X0 + px * c - py * s, Y0 + px * s + py * c]; };
    const M = (t, v) => Rv(W / T * t, -lerp(H / (vmax - vmin), W / (hi - lo), U) * (v - lerp(vmin, lo, U)));
    const line = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
    const dot = (x, y, r, f) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = f; ctx.fill(); };

    function draw() {
      const cs = getComputedStyle(cv), INK = cs.color;
      const st = (k, f) => stage > k ? 1 : stage < k ? 0 : f();
      const pP = i => st(1, () => pr(e, ST[i], DUR[i]));
      const pS = i => st(2, () => io(pr(e, 0.3 + i * 0.1, 0.5)));
      const pD = i => st(2, () => back(pr(e, 0.75 + i * 0.1, 0.25)));
      // stage 5: fade ECDF/suprema, rotate back, draw quantile as a horizontal threshold
      const out5 = st(5, () => io(pr(e, 0, 0.4))), shrink = st(5, () => io(pr(e, 0, 0.5)));
      const rb = st(5, () => io(pr(e, 0.5, 1.8))), pH = st(5, () => io(pr(e, 2.4, 0.8)));
      U = st(3, () => io(pr(e, 0.4, 1.8))) - rb;
      // stage 6: drifting process, stopped at the threshold
      const dim = 1 - 0.4 * st(6, () => io(pr(e, 0, 0.4)));
      const pN = st(6, () => pr(e, 0.3, 2.4)), pHit = st(6, () => back(pr(e, 2.7, 0.3))), pMsg = st(6, () => io(pr(e, 2.8, 0.4)));
      const pA = st(3, () => io(pr(e, 2.3, 0.5))), pE = st(3, () => io(pr(e, 2.7, 1.6))), pQ = st(4, () => io(pr(e, 0.3, 0.8)));
      const fade = 1 - io(clamp(U * 1.5)), lf = 1 - clamp(U * 4);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.setTransform(K, 0, 0, K, 0, 0);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.font = FS + 'px ' + cs.fontFamily;
      // processes
      ctx.lineWidth = 3; ctx.strokeStyle = GREY;
      for (let i = 0; i < N; i++) {
        const g = pP(i), k = Math.floor(g * STEPS); if (k < 1 || fade <= 0) continue;
        ctx.globalAlpha = 0.35 * fade * dim; ctx.beginPath();
        for (let j = 0; j <= k; j++) { const q = M(j * dt, P[i][j]); j ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
        ctx.stroke(); ctx.globalAlpha = 1;
        if (g < 1) { const q = M(k * dt, P[i][k]); dot(q[0], q[1], 5, GREY); }
      }
      // dotted supremum lines
      if (fade > 0 && stage < 5) {
        ctx.setLineDash([0.1, 9]); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.globalAlpha = 0.7 * fade;
        for (let i = 0; i < N; i++) { const g = pS(i); if (g > 0) line(M(A[i], S[i]), M(A[i] * (1 - g), S[i])); }
        ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
      // axes
      ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 2.5;
      if (fade > 0) { ctx.globalAlpha = fade; line(Rv(0, 0), Rv(W, 0)); line(Rv(W, 0), Rv(W, 12)); line(Rv(0, 0), Rv(0, 12)); }
      if (lf > 0) { ctx.globalAlpha = lf; ctx.textAlign = 'center'; ctx.fillText('0', X0, Y0 + 52); ctx.fillText('T', X0 + W, Y0 + 52); }
      ctx.globalAlpha = 1;
      line(Rv(0, 0), Rv(0, -lerp(H, W, U)));
      // ECDF axis
      if (pA > 0) {
        ctx.globalAlpha = pA * (1 - out5); line([X0, Y0], [X0, Y0 - H]); line([X0 - 12, Y0 - HP], [X0, Y0 - HP]); line([X0 - 12, Y0], [X0, Y0]);
        ctx.textAlign = 'right'; ctx.fillText('1', X0 - 22, Y0 - HP + 13); ctx.fillText('0', X0 - 22, Y0 + 13); ctx.globalAlpha = 1;
      }
      // ECDF
      if (pE > 0 && out5 < 1) {
        ctx.save(); ctx.globalAlpha = 1 - out5; ctx.beginPath(); ctx.rect(0, 0, X0 + pE * W + 2, LH); ctx.clip();
        ctx.strokeStyle = BLUE; ctx.lineWidth = 4; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(X0, Y0);
        for (let i = 0; i < N; i++) { const x = xs(SS[i]); ctx.lineTo(x, Y0 - i / N * HP); ctx.lineTo(x, Y0 - (i + 1) / N * HP); }
        ctx.lineTo(X0 + W, Y0 - HP); ctx.stroke();
        for (let i = 0; i < N; i++) dot(xs(SS[i]), Y0 - (i + 1) / N * HP, 7, BLUE);
        ctx.restore();
      }
      // supremum dots
      for (let i = 0; i < N; i++) { const r = 7 * pD(i); if (r > 0 && out5 < 1) { const q = M(0, S[i]); ctx.globalAlpha = 1 - out5; dot(q[0], q[1], r, INK); ctx.globalAlpha = 1; } }
      // quantile
      if (pQ > 0) {
        const x = xs(Q);
        ctx.setLineDash([0.1, 10]); ctx.lineCap = 'round'; ctx.strokeStyle = RED; ctx.lineWidth = 5;
        if (shrink < 1) line([x, Y0], [x, Y0 - pQ * H * (1 - shrink)]); ctx.setLineDash([]);
        ctx.globalAlpha = clamp((pQ - 0.6) / 0.4) * (1 - out5); ctx.fillStyle = RED; ctx.textAlign = 'right';
        ctx.fillText('1 − α quantile', x - 18, Y0 - H + 30); ctx.globalAlpha = 1;
      }
      // quantile as a threshold on the original axes
      if (stage >= 5) {
        const a = M(0, Q); dot(a[0], a[1], 8 * shrink, RED);
        if (pH > 0) {
          const b = M(pH * T, Q);
          ctx.setLineDash([0.1, 10]); ctx.lineCap = 'round'; ctx.strokeStyle = RED; ctx.lineWidth = 5;
          line(a, b); ctx.setLineDash([]);
          const c = M(T, Q); ctx.globalAlpha = pH; ctx.fillStyle = RED; ctx.textAlign = 'right';
          ctx.fillText('1 − α quantile', c[0], c[1] - 20); ctx.globalAlpha = 1;
        }
      }
      if (AP && pN > 0) {
        const k = Math.max(1, Math.floor(pN * HK));
        ctx.strokeStyle = BLUE; ctx.lineWidth = 4; ctx.beginPath();
        for (let j = 0; j <= k; j++) { const q = M(j * dt, AP[j]); j ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
        ctx.stroke();
        if (pN < 1) { const h = M(k * dt, AP[k]); dot(h[0], h[1], 6, BLUE); }
        if (pHit > 0) {
          const hp = M(HK * dt, Q);
          ctx.globalAlpha = pMsg; ctx.setLineDash([0.1, 9]); ctx.lineWidth = 3; ctx.strokeStyle = INK;
          line(hp, [hp[0], Y0]); ctx.setLineDash([]);
          ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.fillText('τ', hp[0], Y0 + 52);
          ctx.globalAlpha = 1; dot(hp[0], hp[1], 10 * pHit, RED);
          ctx.globalAlpha = pMsg; ctx.fillStyle = RED; ctx.textAlign = 'right';
          ctx.font = 'bold ' + FS + 'px ' + cs.fontFamily; ctx.fillText('reject H₀', hp[0] - 20, hp[1] - 24);
          ctx.font = FS + 'px ' + cs.fontFamily; ctx.globalAlpha = 1;
        }
      }
    }
    function resize() {
      const w = cv.offsetWidth; if (!w) return;
      const s = (window.devicePixelRatio || 1) * (window.Reveal && Reveal.getScale ? Reveal.getScale() : 1);
      cv.width = Math.round(w * s); cv.height = Math.round(w * LH / LW * s); K = cv.width / LW; draw();
    }
    function loop(now) {
      if (t0 === null) t0 = now;
      e = (now - t0) / 1000; draw();
      if (e < END[stage]) raf = requestAnimationFrame(loop);
    }
    return {
      animate(k) { cancelAnimationFrame(raf); stage = k; e = 0; t0 = null; resize(); raf = requestAnimationFrame(loop); },
      snap(k) { cancelAnimationFrame(raf); stage = k; e = Infinity; resize(); },
      resize
    };
  }

  function init() {
    const anims = new Map();
    document.querySelectorAll('canvas.suprema').forEach(cv => anims.set(cv, makeAnim(cv)));
    const stageOf = slide => slide.querySelectorAll('.fragment.suprema-step.visible').length;
    const each = (slide, f) => slide && slide.querySelectorAll('canvas.suprema').forEach(cv => f(anims.get(cv), stageOf(slide)));
    Reveal.on('fragmentshown', ev => { if (ev.fragment.classList.contains('suprema-step')) each(ev.fragment.closest('section'), (a, k) => a.animate(k)); });
    Reveal.on('fragmenthidden', ev => { if (ev.fragment.classList.contains('suprema-step')) each(ev.fragment.closest('section'), (a, k) => a.snap(k)); });
    Reveal.on('slidechanged', ev => each(ev.currentSlide, (a, k) => a.snap(k)));
    Reveal.on('resize', () => anims.forEach(a => a.resize()));
    anims.forEach((a, cv) => a.snap(stageOf(cv.closest('section'))));
  }
  (function boot() {
    if (!window.Reveal || !Reveal.on) return setTimeout(boot, 50);
    if (Reveal.isReady && Reveal.isReady()) init(); else Reveal.on('ready', init);
  })();
})();
</script>
